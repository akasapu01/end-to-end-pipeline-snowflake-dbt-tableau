version: 2

models:
  - name: stg_sales
    description: "Cleaned, typed sales order lines from the raw_sales seed."
    columns:
      - name: order_id
        description: "Order identifier (header)."
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        description: "Units purchased on this order line."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: unit_price
        tests: [not_null]
      - name: line_total
        description: "unit_price * quantity."
        tests: [not_null]
