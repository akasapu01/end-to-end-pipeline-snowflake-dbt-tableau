# dbt connection profiles for the emekamarkt project.
#
# The primary target is Snowflake (the project's warehouse). A local DuckDB
# target is also provided so the full pipeline (seed -> models -> tests) can be
# built and verified on a laptop with no cloud account:
#
#   dbt build --target duckdb
#
# All Snowflake settings are read from environment variables (see .env.example).

emekamarkt:
  target: dev
  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'EMEKAMARKT') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
      threads: 4
      client_session_keep_alive: false

    duckdb:
      type: duckdb
      path: "target/emekamarkt.duckdb"
      threads: 4
