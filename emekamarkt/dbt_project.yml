name: 'emekamarkt'
version: '1.0.0'
config-version: 2

profile: 'emekamarkt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  emekamarkt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  emekamarkt:
    raw_sales:
      +column_types:
        order_id: varchar
        customer_id: varchar
        product_id: varchar
